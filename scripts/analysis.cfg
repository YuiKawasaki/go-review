# KataGo Analysis Engine 設定（Surface / CPU Eigen 想定）
# 起動例:
#   katago.exe analysis -config analysis.cfg -model model.bin.gz

# --- 並列度: 2コア4スレッド機ではスレッドを増やしても速くならず発熱だけ増える
numAnalysisThreads = 2
numSearchThreads = 2

# --- 視点。アプリ側でも overrideSettings で BLACK を明示しているが、
#     設定ファイル側も合わせておく（符号の反転は学習に有害なため）
reportAnalysisWinratesAs = BLACK

# --- 探索。visits は呼び出し側（PASS1_VISITS / PASS2_VISITS）で指定する
maxVisits = 1500
analysisPVLen = 12
rootSymmetryPruning = true

# --- メモリ。8GB 機なので控えめに
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
numNNServerThreadsPerModel = 1

# --- ログは静かに（バッチ実行の妨げにしない）
logAllRequests = false
logAllResponses = false
logSearchInfo = false
logToStderr = false
